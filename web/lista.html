<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lista de la compra · Menuda</title>
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#b8492b" />
  <link rel="icon" href="icono.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="estilos.css" />
  <style>
    body { padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
    .compartida { max-width: 560px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 0; }
    .compartida header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .compartida header img { width: 36px; height: 36px; border-radius: 9px; }
    .compartida h1 { font-size: 1.35rem; }
    .compartida .meta { color: var(--suave); font-size: 0.9rem; margin: 4px 0 0; }
    .compartida .progreso { height: 8px; border-radius: 99px; background: var(--linea); overflow: hidden; margin: 12px 0 4px; }
    .compartida .progreso span { display: block; height: 100%; background: var(--verde); transition: width .2s; }
    .compartida ul { list-style: none; margin: 0; padding: 0; background: var(--panel); border-radius: 12px; box-shadow: var(--sombra); }
    .compartida li + li { border-top: 1px solid var(--linea); }
    .compartida li button { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; cursor: pointer; min-height: 52px; -webkit-tap-highlight-color: transparent; }
    .compartida li button:focus-visible { outline: 2px solid var(--marca); outline-offset: -2px; border-radius: 12px; }
    .compartida .circulo { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--suave);
      display: grid; place-items: center; font-weight: 700; color: #fff; }
    .compartida .cogido .circulo { background: var(--verde); border-color: var(--verde); }
    .compartida .que { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .compartida .que small { color: var(--suave); font-size: 0.85rem; }
    .compartida .cogido .que span { text-decoration: line-through; color: var(--suave); }
    .compartida .aviso { background: var(--panel); border-radius: 12px; box-shadow: var(--sombra); padding: 24px 16px; text-align: center; margin-top: 24px; }
    .compartida .error { color: var(--peligro); font-size: 0.9rem; min-height: 1.2em; margin: 8px 0 0; }
    .compartida .fin { text-align: center; font-weight: 600; color: var(--verde); margin: 16px 0 0; }
  </style>
  <script src="vendor/supabase.js"></script>
</head>
<body>
  <main class="compartida" id="lista"><p class="meta">Cargando la lista…</p></main>
  <script type="module" src="src/lista-compartida.js"></script>
</body>
</html>
